name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - run: xcodebuild -version   # log the pinned version
      - run: swift test --package-path EldritchCore
      - run: swift test --package-path EldritchData
      - run: xcodebuild test -scheme EldritchGenesis -destination 'platform=iOS Simulator,name=iPhone 17' -skipPackagePluginValidation
